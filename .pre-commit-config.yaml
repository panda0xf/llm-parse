repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic-ai>=0.0.49
          - fastapi>=0.115.0
          - pydantic-settings>=2.0.0
          - tenacity>=8.2.0
          - pydantic>=2.0.0
          - pytest>=8.0
          - pytest-asyncio>=0.24
          - httpx>=0.27.0
        args: [--strict]

  - repo: local
    hooks:
      - id: clean-uv-lock
        name: Clean uv.lock
        entry: python scripts/clean_uv_lock.py
        language: python
        files: ^uv\.lock$
        pass_filenames: true
