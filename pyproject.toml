[project]
name = "llm-parse"
version = "0.1.0"
description = "通用 LLM 结构化解析服务"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.49",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
lint = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    {include-group = "lint"},
]

[project.scripts]
llm-parse = "llm_parse.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_parse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["llm_parse"]

[tool.coverage.report]
show_missing = true
fail_under = 95

# ---------------------------------------------------------------
# Ruff 配置
# ---------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "RUF001", # 字符串中的全角字符（中文项目正常）
    "RUF002", # docstring 中的全角字符
    "RUF003", # 注释中的全角字符
    "B008",   # Depends() 在默认参数中是 FastAPI 标准写法
]

[tool.ruff.lint.isort]
known-first-party = ["llm_parse"]

# ---------------------------------------------------------------
# MyPy 配置
# ---------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false
