[project]
name = "llm-parse"
version = "0.1.0"
description = "通用 LLM 结构化解析服务"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.49",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
]

[project.scripts]
llm-parse = "llm_parse.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_parse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["llm_parse"]

[tool.coverage.report]
show_missing = true
fail_under = 95
